<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuickGUI component demo</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#fafafc; }
    canvas { display:block; width:100%; height:100%; outline:none; touch-action:none; }
    #error { position:absolute; inset:0; padding:32px; box-sizing:border-box; display:grid; place-content:center; color:#52525b; font:14px/1.6 system-ui; text-align:center; }
    #error[hidden] { display:none; }
  </style>
</head>
<body>
  <canvas id="demo" aria-label="Interactive QuickGUI component demo" tabindex="0"></canvas>
  <div id="error" role="alert" hidden></div>
  <script type="module">
    let state = 'loading';
    const report = status => { state = status; document.documentElement.dataset.demoState = state; parent.postMessage({type:'quickgui-demo', status}, location.origin); };
    window.addEventListener('message', event => { if (event.source === parent && event.origin === location.origin && event.data?.type === 'quickgui-demo-status-request') report(state); });
    function fail(error) { console.error(error); const node=document.querySelector('#error'); node.textContent='This demo needs a browser with WebGPU or WebGL2. Enable one of those APIs and reload to try again.'; node.hidden=false; report('error'); }
    window.addEventListener('error', event => fail(event.error));
    window.addEventListener('quickgui:error', () => fail(new Error('QuickGUI rendering failed')));
    window.addEventListener('quickgui:ready', () => report('ready')); 
    window.addEventListener('unhandledrejection', event => fail(event.reason));
    try {
      const {default:init, start} = await import('./__DEMO_BUILD__/quickgui.js');
      await init();
      const canvas=document.querySelector('#demo');
      const component=new URLSearchParams(location.search).get('component') || 'button';
      document.title=`${component} · QuickGUI demo`;
      await start(canvas, component, innerWidth, innerHeight);

    } catch (error) { fail(error); }
  </script>
</body>
</html>
