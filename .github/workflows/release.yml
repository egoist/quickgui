name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native ${{ matrix.name }}
    if: github.repository == 'egoist/quickgui'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            id: macos
            os: macos-latest
            targets: darwin-arm64 darwin-x64
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
          - name: Linux x64
            id: linux-x64
            os: ubuntu-latest
            targets: linux-x64
            rust-targets: x86_64-unknown-linux-gnu
          - name: Linux arm64
            id: linux-arm64
            os: ubuntu-24.04-arm
            targets: linux-arm64
            rust-targets: aarch64-unknown-linux-gnu
          - name: Windows x64
            id: windows-x64
            os: windows-latest
            targets: windows-x64
            rust-targets: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Synchronize package versions
        run: bun scripts/sync-release-version.ts
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustup target add ${{ matrix.rust-targets }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: '**/go.sum'
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-release-native-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-release-native-
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Build native packages
        run: bun scripts/build-release-natives.ts ${{ matrix.targets }}
      - name: Verify optional native extension bundles
        if: runner.os == 'macOS'
        run: bun scripts/check-extensions.ts
      - name: Install Zig for extension templates
        if: runner.os == 'macOS'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Verify extension project templates from the packed CLI
        if: runner.os == 'macOS'
        run: bun scripts/check-extension-templates.ts
      - name: Stage native libraries
        run: bun scripts/stage-native-lib-artifacts.ts target/native-libs
      - name: Upload native libraries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-libs-${{ matrix.id }}
          path: target/native-libs
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    if: github.repository == 'egoist/quickgui'
    needs: [native]
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Synchronize package versions
        run: bun scripts/sync-release-version.ts
      - name: Resolve release source
        id: source
        shell: bash
        run: |
          release_sha=$(git rev-parse HEAD)
          release_version=$(bun -p 'require("./package.json").version')
          if [[ $GITHUB_REF_TYPE == tag ]]; then
            release_tag=$GITHUB_REF_NAME
          else
            release_tag="v$release_version"
          fi
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'QUICKGUI_RELEASE_TAG=%s\n' "$release_tag" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install 1.90.0 --profile minimal
          rustup default stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: '**/go.sum'
      - name: Verify tagged release metadata
        id: release
        run: bun scripts/release-metadata.ts "$GITHUB_OUTPUT"
      - name: Verify release tag target
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$QUICKGUI_RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$QUICKGUI_RELEASE_TAG:refs/tags/$QUICKGUI_RELEASE_TAG"
            tagged_sha=$(git rev-list -n 1 "$QUICKGUI_RELEASE_TAG")
            if [[ $tagged_sha != '${{ steps.source.outputs.sha }}' ]]; then
              echo "release tag $QUICKGUI_RELEASE_TAG points to $tagged_sha, not ${{ steps.source.outputs.sha }}" >&2
              exit 1
            fi
          fi
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Download native libraries
        uses: actions/download-artifact@v5
        with:
          pattern: native-libs-*
          path: .
          merge-multiple: true
      - name: Restore downloaded native libraries
        run: bun scripts/restore-native-lib-artifacts.ts
      - name: Verify downloaded native libraries
        shell: bash
        run: |
          missing=0
          for path in \
            packages/native/lib/darwin-arm64/libquickgui_host.dylib \
            packages/native/lib/darwin-x64/libquickgui_host.dylib \
            packages/native/lib/linux-arm64/libquickgui_host.so \
            packages/native/lib/linux-x64/libquickgui_host.so \
            packages/native/lib/windows-x64/quickgui_host.dll \
            packages/extension-terminal/lib/darwin-arm64/libquickgui_terminal.dylib \
            packages/extension-terminal/lib/windows-x64/quickgui_terminal.dll \
            packages/extension-updater/lib/windows-x64/quickgui_updater.dll
          do
            if [[ ! -f $path ]]; then
              echo "missing $path" >&2
              missing=1
            fi
          done
          if (( missing )); then
            echo "downloaded native tree:" >&2
            find native extension-terminal extension-updater packages -type f \( \
              -name 'libquickgui_*' -o -name 'quickgui_*.dll' -o -name 'quickgui-updater-helper*' \
            \) 2>/dev/null | sort >&2 || true
            exit 1
          fi
      - name: Build and verify npm tarballs
        run: bun scripts/package-npm-release.ts target/npm-release
      - name: Verify registry publication plan
        run: |
          scripts/release-crates.sh --check
          bun scripts/release-npm.ts --check target/npm-release
      - name: Upload npm release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quickgui-${{ steps.release.outputs.version }}-npm-${{ steps.source.outputs.sha }}
          path: |
            target/npm-release/*.tgz
            target/npm-release/NPM_SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Publish Rust crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          QUICKGUI_RELEASE_ALLOW_DIRTY: 1
        run: scripts/release-crates.sh --publish
      - name: Publish Go module tag
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          go_tag="go/v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$go_tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$go_tag:refs/tags/$go_tag"
            existing=$(git rev-list -n 1 "$go_tag")
            if [[ $existing == "$RELEASE_SHA" ]]; then
              echo "Go module tag $go_tag already points at $RELEASE_SHA"
            else
              echo "Go module tag $go_tag already published at $existing; leaving it in place"
            fi
          else
            git tag "$go_tag" "$RELEASE_SHA"
            git push origin "refs/tags/$go_tag"
          fi
      - name: Publish npm packages
        run: bun scripts/release-npm.ts --publish target/npm-release
      - name: Verify public registry installs
        run: bun scripts/release-registry-smoke.ts '${{ steps.release.outputs.version }}'
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$QUICKGUI_RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$QUICKGUI_RELEASE_TAG" --title "QuickGUI $RELEASE_VERSION"
            gh release upload "$QUICKGUI_RELEASE_TAG" target/npm-release/*.tgz target/npm-release/NPM_SHA256SUMS --clobber
          elif git rev-parse --verify "refs/tags/$QUICKGUI_RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$QUICKGUI_RELEASE_TAG" \
              --verify-tag \
              --title "QuickGUI $RELEASE_VERSION" \
              --generate-notes \
              target/npm-release/*.tgz \
              target/npm-release/NPM_SHA256SUMS
          else
            gh release create "$QUICKGUI_RELEASE_TAG" \
              --target "$RELEASE_SHA" \
              --title "QuickGUI $RELEASE_VERSION" \
              --generate-notes \
              target/npm-release/*.tgz \
              target/npm-release/NPM_SHA256SUMS
          fi
