name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ inputs.ref == '' && github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  macos-quality:
    name: macOS quality gate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Resolve source revision
        id: source
        shell: bash
        run: git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"
      - name: Synchronize package versions
        run: node scripts/sync-release-version.mjs
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Verify release metadata
        id: release
        shell: bash
        run: scripts/release-metadata.sh "$GITHUB_OUTPUT"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup toolchain install 1.90.0 --profile minimal
          rustup default stable
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-stable-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check release-gate scripts
        run: bash -n scripts/*.sh
      - name: Run all tests
        run: scripts/with-macos-ghostty-zig.sh cargo test --all-targets --all-features --locked
      - name: Check every target and feature
        run: scripts/with-macos-ghostty-zig.sh cargo check --all-targets --all-features --locked
      - name: Check minimum supported Rust version
        run: scripts/with-macos-ghostty-zig.sh cargo +1.90.0 check --all-targets --all-features --locked
      - name: Run Clippy
        run: scripts/with-macos-ghostty-zig.sh cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: scripts/with-macos-ghostty-zig.sh cargo doc --no-deps --all-features --locked
      - name: Verify publish archives and downstream installation
        env:
          QUICKGUI_PACKAGE_ALLOW_DIRTY: 1
          QUICKGUI_PACKAGE_TARGET_DIR: target/package-gate
          QUICKGUI_PACKAGE_TOOLCHAIN: 1.90.0
        run: scripts/package-release-gate.sh
      - name: Upload verified release-candidate crates
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: quickgui-${{ steps.release.outputs.version }}-crates-${{ steps.source.outputs.sha }}
          path: |
            target/package-gate/package/*.crate
            target/package-gate/package/SHA256SUMS
            CHANGELOG.md
            docs/releasing.md
          if-no-files-found: error
          retention-days: 30

  portable-check:
    name: ${{ matrix.name }} compile gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux MSRV
            os: ubuntu-latest
            toolchain: 1.90.0
          - name: Windows
            os: windows-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Synchronize package versions
        run: node scripts/sync-release-version.mjs
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install Rust ${{ matrix.toolchain }}
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal && rustup default ${{ matrix.toolchain }}
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.toolchain }}-
      - name: Check every target and feature
        run: cargo check --all-targets --all-features --locked

  go-frontend:
    name: Go frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test Go frontend without cgo
        env:
          CGO_ENABLED: "0"
        run: go test ./packages/go/...
      - name: Test Quick Git Go example without cgo
        env:
          CGO_ENABLED: "0"
        run: go test ./...
        working-directory: examples/quick-git-go
