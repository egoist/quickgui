name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ inputs.ref == '' && github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  go-and-cli:
    name: Go and TypeScript CLI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache-dependency-path: '**/go.sum'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test:js
      - run: bun run test:typescript
      - run: bun scripts/generate-typescript.ts --check
      - run: bun run typecheck:js
      - run: bash scripts/check-go.sh
      - name: Compile CGO-free SDK for other platforms
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go -C go build ./...
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go -C go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go -C go build ./...
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go -C go build ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go -C go build ./...

  macos-test:
    name: macOS tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Synchronize package versions
        run: bun scripts/sync-release-version.ts
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-stable-test-
            cargo-${{ runner.os }}-stable-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check release-gate scripts
        run: bash -n scripts/*.sh
      - name: Run all tests
        run: scripts/with-macos-ghostty-zig.sh cargo test --all-targets --all-features --locked
      - name: Test native font rasterization and cache reuse
        run: cargo test --manifest-path vendor/cosmic_text/Cargo.toml --lib
      - name: Run Clippy
        run: scripts/with-macos-ghostty-zig.sh cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: scripts/with-macos-ghostty-zig.sh cargo doc --no-deps --all-features --locked

  macos-backends:
    name: macOS extension backends
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Synchronize package versions
        run: bun scripts/sync-release-version.ts
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-stable-backends-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-stable-backends-
            cargo-${{ runner.os }}-stable-
      - name: Test dynamic host and standalone extension backends
        run: |
          scripts/with-macos-ghostty-zig.sh cargo test -p quickgui-host -p quickgui-terminal -p quickgui-updater --lib --locked
          cargo test --lib --features terminal-extension --locked

  macos-package:
    name: macOS package gate
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Resolve source revision
        id: source
        shell: bash
        run: git rev-parse HEAD | sed 's/^/sha=/' >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Synchronize package versions
        run: bun scripts/sync-release-version.ts
      - name: Verify release metadata
        id: release
        shell: bash
        run: bun scripts/release-metadata.ts "$GITHUB_OUTPUT"
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal && rustup default 1.90.0
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-1.90.0-package-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-1.90.0-package-
      - name: Verify publish archives and downstream installation
        env:
          QUICKGUI_PACKAGE_ALLOW_DIRTY: 1
          QUICKGUI_PACKAGE_TARGET_DIR: target/package-gate
          QUICKGUI_PACKAGE_TOOLCHAIN: 1.90.0
        run: scripts/package-release-gate.sh
      - name: Upload verified release-candidate crates
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: quickgui-${{ steps.release.outputs.version }}-crates-${{ steps.source.outputs.sha }}
          path: |
            target/package-gate/package/*.crate
            target/package-gate/package/SHA256SUMS
            CHANGELOG.md
            docs/releasing.md
          if-no-files-found: error
          retention-days: 30

  portable-check:
    name: ${{ matrix.name }} compile gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux MSRV
            os: ubuntu-latest
            toolchain: 1.90.0
          - name: Windows
            os: windows-latest
            toolchain: stable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Synchronize package versions
        run: bun scripts/sync-release-version.ts
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Install Rust ${{ matrix.toolchain }}
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal && rustup default ${{ matrix.toolchain }}
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.toolchain }}-
      - name: Check every target and feature
        run: cargo check --all-targets --all-features --locked

      - name: Test optional updater and installer helper
        run: |
          cargo test -p quickgui-updater --locked
          cargo test --manifest-path vendor/cosmic_text/Cargo.toml --lib
