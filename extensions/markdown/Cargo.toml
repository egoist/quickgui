[package]
name = "quickgui-markdown"
version = "0.1.6"
edition = "2024"
rust-version = "1.90"
description = "Markdown native component extension"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
quickgui-extension-sdk = { path = "../../crates/quickgui-extension-sdk", version = "=0.1.6" }
serde_json = "1.0"
pulldown-cmark = "0.13"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("editor"))'] }
