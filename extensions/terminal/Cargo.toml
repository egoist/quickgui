[package]
name = "quickgui-terminal"
version = "0.1.4-next.4"
edition = "2024"
rust-version = "1.90"
description = "Optional PTY and Ghostty backend for the QuickGUI terminal extension"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "windows_msvc_link"
path = "windows_msvc_link.rs"

[dependencies]
quickgui-extension-sdk = { path = "../../crates/quickgui-extension-sdk", version = "=0.1.4-next.4" }
bitflags = "2.9"
libc = "0.2"
libghostty-vt = { version = "0.2.1", default-features = false }
# Direct so this crate's build.rs receives DEP_GHOSTTY_VT_INCLUDE from the sys crate.
libghostty-vt-sys = { version = "0.2.1", default-features = false }
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
