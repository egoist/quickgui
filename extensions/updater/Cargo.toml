[package]
name = "quickgui-updater"
version = "0.1.4-next.4"
edition = "2024"
rust-version = "1.90"
description = "Optional Sparkle-compatible automatic updater for QuickGUI"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "quickgui-updater-helper"
path = "src/helper.rs"

[dependencies]
quickgui-extension-sdk = { path = "../../crates/quickgui-extension-sdk", version = "=0.1.4-next.4" }
base64 = "0.22"
ed25519-dalek = "2.2"
roxmltree = "0.21"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[target.'cfg(not(target_os = "macos"))'.dependencies]
ureq = "3.4"
tempfile = "3.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSObject", "NSString", "NSBundle", "NSThread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Registry"] }

[dev-dependencies]
ureq = "3.4"
tempfile = "3.23"
