[package]
name = "quickgui-system"
version = "0.1.6"
edition = "2024"
rust-version = "1.89"
description = "Cross-platform operating-system services for QuickGUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/egoist/quickgui"
include = ["/src/**"]

[features]
default = ["autostart", "crash-reporter", "protocol", "secure-storage"]
autostart = ["dep:auto-launch"]
file-watcher = ["dep:notify"]
crash-reporter = ["dep:serde", "dep:serde_json", "dep:ureq"]
protocol = ["dep:dunce", "dep:rust-ini", "dep:winreg"]
secure-storage = ["dep:keyring"]

[dependencies]
auto-launch = { version = "0.6.0", optional = true }
dirs = "6.0.0"
keyring = { version = "4.1.6", optional = true }
notify = { version = "8.2.0", optional = true }
os_info = { version = "3.15.0", default-features = false }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sys-locale = "0.3.2"
thiserror = "2.0"
ureq = { version = "3.4.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hostname = "0.4.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rust-ini = { version = "0.21.3", optional = true }
zbus = "5.19.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5.1"
libc = "0.2"
core-foundation = "0.9.4"
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSAccessibility", "NSColor", "NSColorSpace", "NSWorkspace"] }
objc2-foundation = { version = "0.2.2", features = ["NSBundle", "NSObject", "NSProcessInfo", "NSString", "NSUserDefaults"] }

[target.'cfg(windows)'.dependencies]
dunce = { version = "1.0.5", optional = true }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Power", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
winreg = { version = "0.55.0", optional = true }
