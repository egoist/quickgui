[package]
name = "quickgui-terminal"
version = "0.1.4-next.3"
edition = "2024"
rust-version = "1.90"
description = "Optional PTY and Ghostty backend for the QuickGUI terminal extension"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitflags = "2.9"
libc = "0.2"
libghostty-vt = { version = "0.2.1", default-features = false }
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
