[package]
name = "quickgui-host"
version = "0.1.6"
edition = "2024"
rust-version = "1.90"
description = "Shared native library for QuickGUI Go applications"
license = "MIT OR Apache-2.0"
repository = "https://github.com/egoist/quickgui"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
libc = "0.2"
quickgui = { path = "../..", features = ["swift-ui", "file-watcher", "text-input-decorations"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"

[dev-dependencies]
quickgui = { path = "../..", features = ["test-support"] }
