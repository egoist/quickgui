[package]
name = "quickgui-host"
version = "0.1.3"
edition = "2024"
rust-version = "1.90"
description = "C ABI application host for natively compiled QuickGUI applications"
license = "MIT OR Apache-2.0"
repository = "https://github.com/egoist/quickgui"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
# Shared-library host for the Go frontend. Omits the scriptc process entry, which
# imports the application's `main` symbol and would leave a cdylib unlinked.
dynamic-host = []

[dependencies]
base64 = "0.22.1"
libc = "0.2"
quickgui = { path = "../..", features = ["swift-ui", "file-watcher", "terminal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"

[dev-dependencies]
quickgui = { path = "../..", features = ["test-support"] }
